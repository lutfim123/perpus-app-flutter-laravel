<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="400" height="650">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Device Frame -->
  <rect x="10" y="10" width="380" height="630" rx="36" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Status Bar -->
  <text x="35" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155">09:41</text>
  <circle cx="340" cy="34" r="4" fill="#334155"/>
  <rect x="350" y="30" width="16" height="8" rx="2" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="352" y="32" width="10" height="4" rx="1" fill="#334155"/>

  <!-- Logo & Title -->
  <circle cx="200" cy="140" r="36" fill="#E3F2FD"/>
  <path d="M185 130 C190 127 196 127 200 131 C204 127 210 127 215 130 V152 C210 149 204 149 200 153 C196 149 190 149 185 152 Z" fill="none" stroke="#1565C0" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="200" y1="131" x2="200" y2="153" stroke="#1565C0" stroke-width="2.5"/>
  
  <text x="200" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">Perpustakaan</text>
  <text x="200" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Masuk untuk mengelola koleksi buku</text>

  <!-- Input Email -->
  <rect x="40" y="260" width="320" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="56" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Email</text>
  <text x="56" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1E293B">admin@example.com</text>

  <!-- Input Password -->
  <rect x="40" y="330" width="320" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="56" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Password</text>
  <text x="56" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1E293B">••••••••</text>
  <!-- Eye Icon -->
  <circle cx="335" cy="356" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="335" cy="356" r="2" fill="#94A3B8"/>

  <!-- Tombol Masuk -->
  <rect x="40" y="410" width="320" height="48" rx="24" fill="#1565C0"/>
  <text x="200" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Masuk</text>

  <!-- Link Daftar -->
  <text x="200" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#1565C0" text-anchor="middle">Belum punya akun? Daftar</text>

  <!-- Home Indicator -->
  <rect x="140" y="625" width="120" height="4" rx="2" fill="#94A3B8"/>
</svg>
