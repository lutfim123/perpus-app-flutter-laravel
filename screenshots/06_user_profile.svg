<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="400" height="650">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Device Frame -->
  <rect x="10" y="10" width="380" height="630" rx="36" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- App Bar -->
  <rect x="10" y="10" width="380" height="70" rx="36" fill="#1565C0"/>
  <rect x="10" y="45" width="380" height="35" fill="#1565C0"/>
  <path d="M36 62 L44 54 M36 62 L44 70" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="58" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Profil Pengguna</text>

  <!-- Profile Card -->
  <rect x="25" y="110" width="350" height="420" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadow)"/>

  <!-- Avatar -->
  <circle cx="200" cy="180" r="44" fill="#E3F2FD"/>
  <text x="200" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="bold" fill="#1565C0" text-anchor="middle">A</text>

  <!-- Name & Email -->
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Admin Perpustakaan</text>
  <text x="200" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">admin@example.com</text>

  <line x1="50" y1="295" x2="350" y2="295" stroke="#F1F5F9" stroke-width="1.5"/>

  <!-- Metadata Rows -->
  <text x="55" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748B">ID Pengguna</text>
  <text x="345" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="end">#1</text>

  <text x="55" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748B">Tanggal Bergabung</text>
  <text x="345" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="end">09-11-2026 14:20</text>

  <text x="55" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748B">Role Akses</text>
  <rect x="290" y="405" width="55" height="22" rx="6" fill="#E0F2FE"/>
  <text x="317" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">Admin</text>

  <!-- Logout Button -->
  <rect x="50" y="460" width="300" height="46" rx="23" fill="#DC2626"/>
  <text x="200" y="489" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">⎋ Logout</text>

  <!-- Home Indicator -->
  <rect x="140" y="625" width="120" height="4" rx="2" fill="#94A3B8"/>
</svg>
