<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="400" height="650">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Device Frame -->
  <rect x="10" y="10" width="380" height="630" rx="36" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- App Bar -->
  <rect x="10" y="10" width="380" height="70" rx="36" fill="#1565C0"/>
  <rect x="10" y="45" width="380" height="35" fill="#1565C0"/>
  <text x="35" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Daftar Buku</text>
  <!-- Action Icons -->
  <circle cx="280" cy="62" r="14" fill="#1E88E5"/>
  <path d="M276 62 A4 4 0 1 1 284 62" stroke="#FFFFFF" stroke-width="1.8" fill="none"/>
  <circle cx="318" cy="62" r="14" fill="#1E88E5"/>
  <circle cx="318" cy="59" r="4" fill="#FFFFFF"/>
  <path d="M312 68 C312 65 315 64 318 64 C321 64 324 65 324 68" fill="#FFFFFF"/>
  <circle cx="355" cy="62" r="14" fill="#1E88E5"/>
  <path d="M352 62 H358 M355 59 L358 62 L355 65" stroke="#FFFFFF" stroke-width="1.8" fill="none"/>

  <!-- Search Bar with Debounce indicator -->
  <rect x="25" y="92" width="350" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <circle cx="45" cy="113" r="5" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <line x1="49" y1="117" x2="54" y2="122" stroke="#64748B" stroke-width="1.5"/>
  <text x="64" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Cari judul / penulis… (otomatis)</text>

  <!-- Card 1: Stok Banyak (Hijau) -->
  <rect x="25" y="146" width="350" height="82" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="55" cy="187" r="18" fill="#E3F2FD"/>
  <text x="55" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#1565C0" text-anchor="middle">1</text>
  <text x="86" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Laskar Pelangi</text>
  <text x="86" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Andrea Hirata · 2005 · </text>
  <text x="210" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#16A34A">Stok: 8</text>
  <!-- Edit & Delete Button -->
  <circle cx="316" cy="187" r="14" fill="#F1F5F9"/>
  <path d="M312 191 L320 183" stroke="#475569" stroke-width="1.5"/>
  <circle cx="350" cy="187" r="14" fill="#FEE2E2"/>
  <path d="M346 183 L354 191 M354 183 L346 191" stroke="#DC2626" stroke-width="1.5"/>

  <!-- Card 2: Stok Menipis <= 5 (Oranye) -->
  <rect x="25" y="238" width="350" height="82" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="55" cy="279" r="18" fill="#E3F2FD"/>
  <text x="55" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#1565C0" text-anchor="middle">2</text>
  <text x="86" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Bumi Manusia</text>
  <text x="86" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Pramoedya A. T. · 1980 · </text>
  <text x="228" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#EA580C">Stok: 3</text>
  <circle cx="316" cy="279" r="14" fill="#F1F5F9"/>
  <path d="M312 283 L320 275" stroke="#475569" stroke-width="1.5"/>
  <circle cx="350" cy="279" r="14" fill="#FEE2E2"/>
  <path d="M346 275 L354 283 M354 275 L346 283" stroke="#DC2626" stroke-width="1.5"/>

  <!-- Card 3: Stok Habis == 0 (Merah) -->
  <rect x="25" y="330" width="350" height="82" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="55" cy="371" r="18" fill="#E3F2FD"/>
  <text x="55" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#1565C0" text-anchor="middle">3</text>
  <text x="86" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Filosofi Teras</text>
  <text x="86" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Henry M. · 2018 · </text>
  <text x="188" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#DC2626">Stok: 0 (Habis)</text>
  <circle cx="316" cy="371" r="14" fill="#F1F5F9"/>
  <path d="M312 375 L320 367" stroke="#475569" stroke-width="1.5"/>
  <circle cx="350" cy="371" r="14" fill="#FEE2E2"/>
  <path d="M346 367 L354 375 M354 367 L346 375" stroke="#DC2626" stroke-width="1.5"/>

  <!-- Footer Info Paginasi -->
  <text x="200" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">3 dari 20 buku</text>

  <!-- Floating Action Button (FAB) -->
  <rect x="250" y="550" width="125" height="48" rx="24" fill="#1565C0" filter="url(#shadow)"/>
  <path d="M272 574 H284 M278 568 V580" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="294" y="579" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Tambah</text>

  <!-- Home Indicator -->
  <rect x="140" y="625" width="120" height="4" rx="2" fill="#94A3B8"/>
</svg>
