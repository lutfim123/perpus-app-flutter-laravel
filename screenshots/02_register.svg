<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="400" height="650">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Device Frame -->
  <rect x="10" y="10" width="380" height="630" rx="36" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Status Bar -->
  <text x="35" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155">09:41</text>
  <circle cx="340" cy="34" r="4" fill="#334155"/>
  <rect x="350" y="30" width="16" height="8" rx="2" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Logo & Title -->
  <circle cx="200" cy="100" r="28" fill="#E3F2FD"/>
  <path d="M188 92 C192 90 197 90 200 93 C203 90 208 90 212 92 V110 C208 108 203 108 200 111 C197 108 192 108 188 110 Z" fill="none" stroke="#1565C0" stroke-width="2" stroke-linejoin="round"/>
  <line x1="200" y1="93" x2="200" y2="111" stroke="#1565C0" stroke-width="2"/>
  
  <text x="200" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">Daftar Akun</text>

  <!-- Input Nama -->
  <rect x="40" y="180" width="320" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="56" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B">Nama</text>
  <text x="56" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1E293B">Lutfi Ramadhan</text>

  <!-- Input Email -->
  <rect x="40" y="238" width="320" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="56" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B">Email</text>
  <text x="56" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1E293B">lutfi@example.com</text>

  <!-- Input Password -->
  <rect x="40" y="296" width="320" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="56" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B">Password</text>
  <text x="56" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1E293B">••••••••</text>

  <!-- Input Konfirmasi Password -->
  <rect x="40" y="354" width="320" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="56" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B">Konfirmasi Password</text>
  <text x="56" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1E293B">••••••••</text>

  <!-- Tombol Daftar -->
  <rect x="40" y="425" width="320" height="46" rx="23" fill="#1565C0"/>
  <text x="200" y="453" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Daftar</text>

  <!-- Link Masuk -->
  <text x="200" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#1565C0" text-anchor="middle">Sudah punya akun? Masuk</text>

  <!-- Home Indicator -->
  <rect x="140" y="625" width="120" height="4" rx="2" fill="#94A3B8"/>
</svg>
